# ETH priced by the ML model and quoted on BOTH sides at once, LIVE. From 19 Oct evening (the owner's): orders ~$1000
# within $2500, markup 0.15 bp; of the guards only the OKX swap's (200 ms / 0.2 bp / 300 ms), the Arcus take pause
# (300 ms) and the drift markup (x2); off: Binance spot, futures and trades, Bybit (a feed for the model only), Arcus
# mid, trend, add, the late-data kill switch ([lag]). The thin-side markup ([imbalance]) and the inventory skew stay.
# never_lead off. Maker only: no taker, no stop-loss. Not next to another ETH bot on the same subaccount live.
# The model: the owner's linear model of 19 Oct (ETH) on the notebook's features (research/ml_pricing.ipynb: r, d
# and basis features, best-level imbalances and their 1 s means, the basis bot's prediction basis_pred_ema30s; the Bybit
# perp among the venues again: [bybit] must stay on),
# target off futures as BTC's (the mean Arcus mid over the next 30 s over the futures mid now), fit on
# StandardScaler-scaled features: 26 of them. A feature that stops coming keeps its last value
# ([ml] skip_missing); only basis_pred_ema30s is required. Use the latest code of branch claude/funny-wright-a95ao3.
# Below: the notes of config.eth-both.toml.
# ETH quoted on BOTH sides at once (direction = "both"): config.eth.toml with the direction, the limit and the inventory controls changed, orders ~$750 (0.312 ETH): two filled orders in a row put the position at the limit.
# 17 Oct (live logs 06:38-11:04): the losses came from positions of the whole $1000 limit held through 7-35 bp
# moves, with only the closing side quoted. 18 Oct (07:47-09:52 UTC, ETH +70 bp): -$7.99 at ~$1000 orders and a $3000
# limit, all of it in the positions held (the spread at the fills made +$0.44). Now (18 Oct afternoon; ~$500 / $1000
# that morning): ~$750 orders and a $1500 limit,
# quotes skewed by the position, no adding past half the
# limit right after a futures move against it; the closing order is the bigger of the whole position and one
# order (a position over one order goes in one order). All maker only.
# The position may go either way up to $1500 (max_position_usd); whichever order shrinks it takes the cut markup
# (close_markup_cut) and close_tol_away; the trend guard holds buys after a fall and sells after a rally. No stop-loss
# and no taker. NOT next to the long ETH bot on the same subaccount (one position per market): stop that one first.
# Needs the code of 17 Oct evening (the inventory controls; older code refuses skew_open, exit_after_s and
# [add_guard]). Below: the notes of the long config.
# naive_mm live config: Arcus ETH-USD from the Tokyo host. Use the latest code of branch claude/funny-wright-a95ao3
# (5789db9 or later: [lag] is a new key, and older code refuses keys it does not know).
# Live: ETH run 12 (3205def), runs 15 and 16 (0286bb7, the owner's markup 0.15 bp, tol 0.03, ratio 40),
# run 21, the night of 14-15 Oct (0.125 bp: 145 trips, -$2.87), 22 (15 Oct 06:02-07:38 UTC: 30 trips, -$0.10)
# and 23, the first with [trades] (07:38-11:04, market down 0.4%: 40 trips, -$0.34). Run 25, the night of 15-16 Oct
# with a CPU core per bot: 96 trips, -$0.84 at ~$100 orders, fills 5 s later -0.18 bp each. Orders of ~$500 from 16 Oct (run 26: 81 trips, -$1.44 in 7 h), ~$1000 from that evening, ~$500 again from 18 Oct.
# The host needs a free CPU core per bot (README, "Хост").
# Units: markup / tol / tol_away / drawdown are FRACTIONS (0.00001 = 0.1 bp); *_ms milliseconds; *_s seconds.
# Keys not listed keep the defaults in naive_mm/config.py, and those defaults are BTC: every symbol below must
# stay ETH (the bot refuses to start when an enabled feed's symbol is not the arcus.market asset). This file
# never trades by itself: the
# command line passes --trade quote / paper / live.
# ETH-USD on Arcus (GET /v1/markets): marketId 2, tick 0.01 below $10k (0.04 bp at $2500), step 0.0000001,
# min order 0.001 ETH AND $5 notional (0.001 ETH is only ~$2.50). The bot keeps buying until a long is worth $5
# at its sell price, then sells it whole, and refuses to quote a buy under $5 (an error line says so).
# Values come from 17 minutes of ETH data (14 Oct, 06:31-06:49 UTC): first guesses, re-check after a long run.
log_level = "INFO"            # order events and price lines reach the orders log at any level

[binance]                     # spot: the spot guard, the price lines and the logs (pricing is off futures)
symbol = "ETHUSDT"            # default endpoints (stream.binance.com / api.binance.com) work from Tokyo; behind a
                              # geo-block (HTTP 451) use wss://data-stream.binance.vision + https://data-api.binance.vision
connections = 1               # ML bots: one connection (19 Oct; was 2): each spot frame parsed once

[arcus]
market = "ETH-USD"
connections = 2               # back to 2 (19 Oct, evening): a server can hand out a connection that stays late (paper
                              # pair: an Arcus connection 74 ms behind another for an hour); with two, the other one's
                              # copies come first and show it, and the late one is reconnected ([agent] slow_link_ms).
                              # The Arcus book is a few frames a second: next to nothing for the loop
stale_timeout_s = 30          # a link that brings no book update for 30 s is reconnected (a stream that stopped
                              # while the connection still answers pings; needs the 15 Oct code)

[pricing]
model = "ml"                  # the [ml] model below prices; the keys of the basis pricing that follow are not used
reference = "futures"         # as BTC. ETH: futures fair R2 to the next 1 s Arcus bid move 5.4%, spot fair ~0%
basis_s = 30                  # Arcus/futures basis -8 bp, std 0.22 bp (Arcus/spot -13 bp, std 0.51); 30 s fitted best
window = 1000                 # used only with basis_s = 0
min_samples = 100             # samples (any update of either book) before the first price: well under a second

[trading]
mode = "off"                  # the command line sets --trade quote / paper / live
direction = "both"            # a buy and a sell at once, order_size each (README, "С двух сторон")
max_position_usd = 2500       # 19 Oct evening, the owner's $2500 (was $1500)
max_position_resume = 0.95    # ... and comes back once the position on that side is under 95% of it
skew_open = 1.0               # the order that adds to the position: markup x (1 + u), u = position / limit (x2 at it)
skew_close = 1.0              # the order that closes it: its markup x (1 - u) (none at the limit): out sooner
exit_after_s = 0              # OFF from 18 Oct, the owner's call: no urgent exit (was 600 s: the closing order
                              # joined the best price with no markup after 10 min). The closing order keeps its markup
exit_loss = 0                 # OFF from 18 Oct as well (was 0.0007: the same once that far under water at the Arcus mid)
markup = 0.000015             # 0.15 bp (19 Oct evening, the owner's; was 0.125 bp)
close_markup_cut = 0.3        # the closing sell takes 30% less markup (0.0875 bp, ~2 ticks): out of a long sooner
tol = 0.000005                # 0.05 bp (was 0.03): a 1-tick move (0.04 bp) no longer re-places the order. Run 12: 34% of
                              # the cancels toward the market were a single tick; 1063 placements/h, 242 per fill.
                              # Under the closing sell's markup (0.125 bp x 0.7 = 0.0875 bp): a sell that drifts one
                              # step toward the market still keeps >= 0.04 bp (a tick). Run 16 (0.03 bp, a falling
                              # hour): 3474 placements/h; 0.05 bp would have saved only 0.5-1.5% there. Pools: far off.
tol_away = 0.000075           # 0.75 bp (19 Oct; was 1.5 bp): an opening order the market left re-placed at 0.75 bp. Paper
                              # 08:36-11:20: with every guard off but OKX's the bot filled half as often, 47 of the 77
                              # fills it missed found its order there but 0.45 bp further (the guards' pulls re-place it)
close_tol_away = 0.00001      # 0.1 bp: a sell left above a target that fell is re-placed once it is 0.1 bp behind. Run 19
                              # at 1.5 bp: the exit sell sat behind its target 66% of the time and at the best ask 7%, while
                              # its target was at the best ask 54%. Run 20 at 0.05 bp: at its target all the time, at the
                              # best ask 38%, but ~1.1 sells a second while exiting (603 in one 511 s exit); 0.1 bp to
                              # halve that. Same price rule, not a stop: only no lag behind it.
order_size = 0.414            # ETH, ~$1000 at $2415 (19 Oct evening, the owner's; was 0.312, ~$750)
never_lead = false            # OFF from 19 Oct evening (was true: join, never improve; pull when the book comes to the
                              # order): the order may be the best price alone, and is not pulled when the book comes to it
came_hold_ms = 300            # NEW 18 Oct: after the book came to our order, not back at its price for 300 ms, one tick
                              # behind it instead (a flickering best: SOL re-placed there 12% of the time, ETH 3%)
dms_timeout_s = 60            # the exchange cancels our ETH order after 60 s of silence (per-market switch, re-armed
                              # every 30 s; independent of the BTC bot's switch)
cancel_lanes = 1              # each cancel also goes out on a spare connection; every copy draws on the cancel pool
presign_cancel_s = 1          # cancel signed right after placing
orders_log = ""               # the command line gives each run its own file with --orders-log

[guard]                       # Binance spot best bid vs its time-weighted mean: leads only 35% of ETH 1 bp moves,
window_ms = 300               # kept mainly as a backup for when the futures guard is blind
drawdown = 0                  # OFF (19 Oct evening, the owner's): of the guards only OKX's and the drift markup stay
pause_ms = 200

[futures]                     # Binance USD-M futures bookTicker: leads 82% of ETH 1 bp moves, ~67 ms early
enabled = true                # required: pricing.reference = "futures"
connections = 1               # ML bots: one connection (19 Oct; was 2): each ticker parsed once. A dropped link leaves no price until it reconnects
symbol = "ETHUSDT"
stale_timeout_s = 5           # a silent link reconnects after 5 s (ETH futures ~157 msgs/s; the other link keeps the book)
window_ms = 100               # 18 Oct (was 300 ms / 0.6 bp / 200 ms), as BTC: a smaller move pauses the side so the
drawdown = 0                  # OFF (19 Oct evening, the owner's): only OKX's guard and the drift markup (the feed stays: pricing and drift read it)
pause_ms = 300                # after a 0.2 bp futures move >= 50 ms earlier 73% of the time; this setting pauses the side
                              # before 72% of its takes (0.6 bp: 53%, 0.3 bp: 68%), a side paused 2.2% of the time

[trades]                      # NEW: Binance spot trades (<symbol>@aggTrade), the earliest sign of a sweep. A trade 0.3 bp
enabled = true                # (7 ticks) under the high of the last 300 ms pulls the buy at once (over the low: the sell),
connections = 1               # ML bots: one connection (19 Oct; was 2): each message parsed once, fewer loop stalls
window_ms = 300               # no buy for 200 ms. Night of 14-15 Oct: 40% of ETH fills came >= 20 ms after such a trade
drawdown = 0                  # OFF (19 Oct evening, the owner's)
pause_ms = 200                # 30 s); by 30 s those fills had lost $2.66, the whole night $2.87. Pauses a side ~4% of a
                              # calm hour, ~24% of the 02:00 crash hour.
                              # Run 23 live: fills 5 s later -0.18 bp each (night -1.19); the 59% with no such trade
                              # within 1 s of the match +0.20, the rest -0.71. The rule saw the trade >= 20 ms before
                              # the match on 29% of the fills, the bot in time on 7 of those 25: it read the others
                              # 69-331 ms late (median 164 ms: the host's loop stalls). Paused a side 4.2% of the time.

[bybit]                       # ON as a feed (the guard off from 19 Oct evening), was a guard: the perp's best bid vs its own 200 ms mean. The toxic ETH taker 0x5c82bbe3
enabled = true                # took in its "predictive" mode (no Binance futures move first) after the Bybit perp moved
connections = 1               # ML bots: one connection (19 Oct; was 2)
category = "linear"           # first in 25% of its takes, the OKX swap in 21%, Binance in 6-8%; on the trades of both
symbol = "ETHUSDT"            # perps (18 Oct 16:20-24:00, 200 ms / 0.2 bp / 300 ms, our 50-60 ms) the two guards would
window_ms = 200               # have kept us out of 85 of its 152 fills and 13 others for +5.6% of the time paused a side.
drawdown = 0                  # OFF as a guard (19 Oct evening, the owner's); the feed stays for the model's Bybit features
pause_ms = 300

[okx]                         # ON: the OKX swap's best bid (bbo-tbt), the same guard as Bybit's
enabled = true
connections = 1               # ML bots: one connection (19 Oct; was 2)
inst_id = "ETH-USDT-SWAP"
window_ms = 200
drawdown = 0.00002
pause_ms = 300

[arcus_guard]                 # Arcus mid vs its own 3 s mean: a safety net for sweeps Binance does not show
window_ms = 3000
drawdown = 0                  # OFF (19 Oct evening, the owner's)
pause_ms = 300                # time (ETH spreads open and close more often); 1.5 bp: ~107 trips/h, ~1% paused

[takes]                       # Arcus taker waves. Any taker order (min_usd 0) in the Arcus public trades pulls our order
min_usd = 0                   # on the side it hit and pauses that side 500 ms after the last such take. 18 Oct tape: 29-64%
pause_ms = 300                # 300 ms (19 Oct evening, the owner's; was 500)
min_takes = 20                # NEW 18 Oct: quiet takers pause nothing. A taker whose last takes (20 at least, 100 at most)
min_move = 0.00002            # moved the Arcus mid its way by under 0.2 bp on average 1 s later. Paused at 1000 ms with
score_ms = 1000               # every taker counted, ETH 12:19-14:55: buys 18%, sells 17% of the time

[portfolio]                   # the crypto bots' positions across the host (BTC, ETH, SOL: 0.86-0.91 correlated over 1 min),
enabled = true                # each bot still its own process on its own market: it writes its position to a file in
asset_class = "crypto"        # dir/live and reads the others' every 100 ms (live only: off in paper). Exposure = sum of weight x position x
weight = 1.3                  # mark (risk in BTC units: 1-min volatility over BTC's, 19 Oct: BTC 1.0, ETH 1.36, SOL
                              # 1.70); u = exposure / limit_usd (-1..1). An order
limit_usd = 2500              # the class's lean over $2500 (19 Oct evening, with the $2500 limits; was $1500)
factor = 0.3                  # an order adding to the class's lean: markup x (1 + 0.3 u), one taking it back x (1 - 0.3 u),
                              # on top of the own skew. 19 Oct, 6 h live: BTC and ETH the same way 26% of the time, at worst
                              # $1670 together; a stopped bot's file is left out after 30 s

[add_guard]                   # no adding past half the limit right after a futures move against the side (17 Oct: BTC
window_s = 300                # added up to its limit after -4.8 bp in 5 min, just before -12 bp: -$0.72). Opening
drawdown = 0                  # OFF (19 Oct evening, the owner's)
pause_s = 60
limit_share = 0.5             # adding allowed up to 50% of max_position_usd while it holds

[drift]                       # a side the futures mid moved against over the last 10 s takes 2.5x its markup (the
window_s = 10                 # owner's 2.5 from 18 Oct, as BTC). Live 17-18 Oct: ETH fills after the futures mid moved
threshold = 0.00002           # 0.2 bp or more against the order within 10 s lost 0.80 bp in 30 s; 18 Oct 08:56-09:52
hold_s = 2                    # (logged only): 1.33 bp, 31 of 58, the others 1.65 (few fills, a 70 bp rally)
markup_factor = 2             # x2 (19 Oct evening, the owner's; was x2.5)

[trend]                       # no buy right after a sharp fall of the futures mid (minutes, not ms). Never holds the
window_s = 120                # sell back: no stop-loss, no taker, only fewer entries
drawdown = 0                  # OFF (19 Oct evening, the owner's)
pause_s = 60                  # 9 trips bought in them -$0.49 of -$2.77. At 30 bp: 7.5% of the time for -$0.30

[vol_markup]                  # the markup scaled by volatility (19 Oct): the reference mid (Binance futures) each second,
enabled = true                # its squared returns in an exponential mean over 60 s (now) and one over 30 min (the
short_s = 60                  # usual); every order's markup x sqrt(now / usual), x0.8 in a quiet spell to x2 in a burst
long_s = 1800                 # (x1 for the first 5 min). 6 h of 19 Oct at these windows: mean x1.0, median x0.87-0.94,
low = 0.8                     # p90 x1.45; at x0.8 31-41% of the time, at x2 1-2%
high = 2.0
warmup_s = 300

[lag]                         # NEW: market data read late = quoting blind. A futures ticker or a spot trade read 200 ms or
max_ms = 0                    # OFF (19 Oct evening, the owner's): no late-data pause
pause_ms = 500                # and nothing is placed until 500 ms after the last such reading. 15 Oct from 13:35 UTC five
                              # bots on one core read futures 2-45 s late for 4 h and kept quoting: 1089 orders refused as
                              # crossing, -$3.80 in a rally. Fills read 100-200 ms late lost 1.0 bp 5 s later, 200-500 ms
                              # 1.8-2.2 bp (under 100 ms: nothing). The health line gives the share of time it held placing.

[imbalance]                   # top-5 Arcus volumes more than 200x lopsided -> the buy's markup x5 (0.625 bp) when the
                              # bids are thin; the closing sell keeps its 0.0875 bp (sides = "open")
levels = 5
ratio = 200                   # was 40. Run 12 at 40: the flag flickered (738 times/h, median 0.4 s) and was on 19% of the
                              # time on the quoted side; orders placed under it sat ~1.3 bp deep for 53% of the buy time
                              # and got 0 of 8 fills, and it was behind ~20% of all cancels. Moves toward the thin side:
                              # +0.1-0.5 bp over 1-30 s at moderate ratios (far under what x5 adds), +1.26 +/- 0.43 bp
                              # over 30 s at 200+ (about the x5 step). An order placed under x5 is now re-priced by tol,
                              # not tol_away, once the flag is gone (no longer left deep).
factor = 5
hold_ms = 300                 # thin side stays thin 300 ms after the book evens out. ETH paper at 6c21c39 (no hold):
                              # 104 of 246 placements flip-flopped; at 3bf31fe with 300 ms: 3 of 245
sides = "open"                # the closing order, held further out by a lopsided book, only keeps the position
                              # longer (BTC run 17: x5 put it 25 bp over the market a quarter of the time). "both" = old

[agent]
quote_line_ms = 1000          # the buy/sell price lines at most every 1 s (was 250 ms, 19 Oct: loop stalls): the ML fair moves on every frame and
                              # every 100 ms tick (paper ETH ML, 18-19 Oct: 981k lines in 7 h, a 351 MB orders log,
                              # against 124k for basis). A change within it shows on the first update after it.

[ml]                          # the owner's ETH model of 19 Oct on the notebook's target off futures; keep these as
                              # the notebook had them (as config.btc-ml-both.toml)
target_window_s = 30.0        # P_rel = P_next / f(t) - 1: the mean Arcus mid over the next 30 s over the futures mid now
target_base = "futures"       # the model predicts that whole: fair mid = futures mid x (1 + prediction), fair bid = that
                              # less the Arcus half spread now (intercept -9.4 bp: the usual ETH basis)
target_price = "mid"
max_gap_s = 10.0
arcus_max_gap_s = 60.0
eval_interval_ms = 100        # the notebook's grid: re-priced at least this often as the windows slide
scaled = true                 # fit on StandardScaler-scaled features: [ml.mean] and [ml.scale] below
skip_missing = true           # a feature unknown now (a book silent, a window or mean not ready) keeps its last value
required = ["basis_pred_ema30s"]  # ... but not the basis bot's own prediction: without it, no price

