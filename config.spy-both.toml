# SPY quoted on BOTH sides at once: live from 20 Oct with small sizes (~$200 orders within $500), config.nvda-both.toml as it is on 20 Oct
# with SPY's feeds and sizes. Arcus SPY-USD (a perp on the SPDR S&P 500 ETF) priced off the Binance SPYUSDT perp, basis
# pricing, no ML. The thresholds are NVDA's (BTC's), not measured on SPY yet: measure on the paper logs first.
# Feeds: the Binance USD-M SPYUSDT perp only (20 Oct, the owner's): the fair and every guard of the market data
# ($35-85M a weekday, 12-19 Oct). Off: Binance spot SPYBUSDT ($0.2-1.2M a day; its book is still read, as the bot
# has no switch for it, but neither prices nor guards), its trades, OKX SPY-USDT-SWAP (~$4M), Bybit SPYUSDT (~$3.4M).
# Not OKX US500-USDT-SWAP (the index, another scale, ~$100k a day) nor SPX-USDT-SWAP (a memecoin).
# SPY-USD on Arcus (GET /v1/markets, 19 Oct): marketId 23, tick 0.01 (0.13 bp at $768: a fine grid next to NVDA's
# 0.47 bp), min order 0.001 SPY and $5. Hours as NVDA's (the US extended session, read from Arcus): see the NVDA notes
# in config.nvda-both.toml. [portfolio]: the stocks class with NVDA, SPY and QQQ.
# Units: markup / tol / tol_away / drawdown are FRACTIONS (0.00001 = 0.1 bp); *_ms milliseconds; *_s seconds.
# This file never trades by itself: the command line passes --trade quote / paper.
log_level = "INFO"

[binance]                     # spot: read (no switch for it), but off: no guard, no trades feed, pricing off futures
symbol = "SPYBUSDT"           # the Binance spot SPY token: base asset SPYB, so [arcus] feed_assets below.
connections = 1               # one is enough for a book nothing reads but the price lines
stale_timeout_s = 0           # no reconnect on a quiet spell: a thin book nothing depends on (weekends: minutes apart)
                              # Behind a geo-block (HTTP 451) use wss://data-stream.binance.vision + https://data-api.binance.vision

[arcus]
market = "SPY-USD"
feed_assets = ["SPYB"]        # the spot symbol is SPYB-USDT, not SPY: without this the bot refuses it
stale_timeout_s = 30          # a link that brings no book update for 30 s is reconnected

[pricing]
reference = "futures"         # fair SPY bid = Binance SPYUSDT futures mid x the basis (Arcus bid / futures mid)
basis_s = 30                  # as BTC: 30 s, futures move first
window = 1000                 # used only with basis_s = 0
min_samples = 100

[trading]
mode = "off"                  # the command line sets --trade quote / paper / live
direction = "both"            # a buy and a sell at once, order_size each (README, "С двух сторон")
max_position_usd = 500        # the position either way stays within $500 (20 Oct, the owner's, the first live); a side at the limit is not quoted
max_position_resume = 0.95    # ... and comes back once the position on that side is under $475
skew_open = 1.0               # as the other two-sided bots: the adding order's markup x (1 + position/limit), the
skew_close = 1.0              # closing one's x (1 - position/limit): with one order filling the $500, none at the limit
exit_after_s = 0              # OFF from 18 Oct, the owner's call: no urgent exit (was 600 s: the closing order
                              # joined the best price with no markup after 10 min). The closing order keeps its markup
exit_loss = 0                 # OFF from 18 Oct as well (was 0.0005: the same once that far under water at the Arcus mid)
markup = 0.000025             # 0.25 bp (NVDA's of 20 Oct) = ~2 ticks of SPY under the fair bid
close_markup_cut = 0.3        # the closing order takes 30% less markup (0.175 bp, rounded to the tick)
off_hours_markup_factor = 2   # outside the US extended session (04:00-20:00 New York, Mon-Fri; holidays by Arcus
                              # isOutsideRth) both sides take twice the markup: 0.5 bp, ~4 ticks
tol = 0.00001                 # 0.1 bp: an order a tick on the danger side of its target is re-placed at once
tol_away = 0.00005            # 0.5 bp (19 Oct evening, the owner's; was 1 bp): a buy left that far behind is placed again
close_tol_away = 0.00001      # = tol: the closing sell follows a falling market tick by tick
order_size = 0.26             # SPY, ~$200 at $768 (20 Oct, the owner's, the first live). Arcus minimum 0.001 SPY and $5; step 0.0000001
never_lead = false            # may improve the best price (20 Oct, the owner's; was true: join, never improve)
came_hold_ms = 300            # NEW 18 Oct: after the book came to our order, not back at its price for 300 ms, one tick
                              # behind it instead (a flickering best: SOL re-placed there 12% of the time, ETH 3%)
dms_timeout_s = 60            # per-market switch, independent of the other bots' switches
cancel_lanes = 1
presign_cancel_s = 1
orders_log = ""               # the command line gives each run its own file with --orders-log

[guard]                       # OFF: Binance spot SPYB, too thin (20 Oct, the owner's)
window_ms = 300
drawdown = 0
pause_ms = 200

[futures]                     # Binance USD-M futures bookTicker: the fair and the main guard
enabled = true
symbol = "SPYUSDT"            # the SPY perp (a TradFi perpetual, USDT-settled; binance.com/en/futures/SPYUSDT), 24/7.
                              # Not reachable from where this was written (HTTP 451): its klines are on data.binance.vision
stale_timeout_s = 30          # off hours the perp's top can stand still for seconds (17 Oct, Saturday: ~2 tickers a
max_book_age_s = 10           # second, gaps up to 8 s): with the default 2 s the quote was pulled 15% of the time,
                              # 325 times in 49 min; with 5 s, 18 Oct (Sunday), still 181 pulls of both sides in 4.2 h
                              # (13% of the cancels). 10 s since 18 Oct: a quiet top is the same price, a dead link
                              # (two of them) is still reconnected after 30 s
window_ms = 300
drawdown = 0.00005            # 0.5 bp (BTC's)
pause_ms = 200

[trades]                      # OFF: Binance spot SPYB trades, too thin (20 Oct, the owner's)
enabled = false

[bybit]                       # OFF: Bybit SPYUSDT, ~$3.4M a day
enabled = false
category = "linear"
drawdown = 0

[okx]                         # OFF: OKX SPY-USDT-SWAP, ~$4M a day (20 Oct, the owner's)
enabled = false

[arcus_guard]                 # Arcus SPY mid vs its own 3 s mean: sweeps the Binance feeds do not show
window_ms = 3000
drawdown = 0.00005            # 0.5 bp: ~4 ticks of the mid (it moves in half-ticks of 0.065 bp)
pause_ms = 300

[portfolio]                   # the US stock bots' positions across the host (NVDA, SPY, QQQ: 0.63-0.86 correlated over
enabled = true                # 1 min, 13-19 Oct), as the crypto bots' (20 Oct, the owner's): each writes its position to a
asset_class = "stocks"        # file in dir/live and reads the others' every 100 ms (live only: off in paper). Exposure = sum of
weight = 0.35                  # weight x position x mark (risk in BTC units: 1-min volatility over BTC's in the US extended
                              # session, Binance perps 13-19 Oct: NVDA 1.1, QQQ 0.6, SPY 0.35); u = exposure / limit_usd.
limit_usd = 1500              # An order adding to the class's lean: markup x (1 + 0.9 u), one taking it back x (1 - 0.9 u),
factor = 0.3                  # 0.3 as the night of 19-20 Oct (20 Oct evening, the owner's; 0.6 / 0.9 earlier on 20 Oct): markup x (1 +- 0.3 u)
shift_bp = 0.3                # 0.3 bp as that night (0.65 / 1.0 earlier on 20 Oct): both quotes moved against the class's lean by 0.3 bp x u

[add_guard]                   # NEW (20 Oct, the owner's): no adding past half the limit right after a futures move against
window_s = 300                # the side. QQQ 20 Oct 13:45-14:20 UTC: +1% after the open, shorted to its limit into it (-$20).
drawdown = 0.0002             # 2 bp from the 5-minute high (a fall: buys) or low (a rally: sells): SPY's ~0.35x BTC's (5 bp), rounded up.
pause_s = 60                  # Opening from flat still goes; for 60 s past the last such price the position on that side
limit_share = 0.5             # may grow to 50% of max_position_usd at most

[open_guard]                  # no adding around the opens (America/New_York, so daylight saving time is followed), as NVDA:
opens = ["Sun 18:00", "Mon-Fri 04:00", "Mon-Fri 09:30"]  # the US index futures' Sunday reopen (18 Oct NVDA +117 bp in
tz = "America/New_York"       # the hour after it), the pre-market and the regular open. From 60 s before to 15 min after
before_s = 60                 # each: no order that opens or adds to the position (flat: nothing quoted); the closing
after_s = 900                 # order as usual, but not through zero. As GLD, which lost its whole night on the Sunday
limit_share = 0               # gold reopen (18 Oct 22:03-22:08 UTC: seven sells in a row into the move, -31 bp)

[open_halt]                   # no opening at the US stock open (09:30 New York, daylight saving time followed): from
opens = ["Mon-Fri 09:30"]     # 10 min before to 10 min after it nothing opens or adds; the closing order goes (closing below)
tz = "America/New_York"       # (20 Oct, the owner's, every stock; was 60 s / 2 min, then 15 / 15 min). NVDA, 19 Oct 13:30 UTC: -50 bp in the
before_s = 600                # first 30 s; QQQ, 20 Oct 13:45-14:20 UTC: +1% after the open, shorted to its $2500 limit
after_s = 600                 # into it (-$20). [open_guard] (no adding) runs on to 15 min after
closing = true                # NEW (21 Oct, the owner's): within the window a position can still be closed (an order of its
                              # size, not past zero); only opening or adding to it stops

[trend]                       # no buy right after a sharp fall of the futures mid (minutes, not ms). Never holds the
window_s = 120                # sell back: no stop-loss, no taker, only fewer entries
drawdown = 0.003              # 30 bp under its 2-minute high (BTC's; SPY moves less: rarely if ever)
pause_s = 60

[vol_markup]                  # the markup scaled by volatility (19 Oct): the reference mid (Binance futures) each second,
enabled = true                # its squared returns in an exponential mean over 60 s (now) and one over 30 min (the
short_s = 60                  # usual); every order's markup x sqrt(now / usual), x0.8 in a quiet spell to x2 in a burst
long_s = 1800                 # (x1 for the first 5 min). 6 h of 19 Oct at these windows: mean x1.0, median x0.87-0.94,
low = 0.8                     # p90 x1.45; at x0.8 31-41% of the time, at x2 1-2%
high = 3                      # x3 at most (20 Oct evening, the owner's; was 2)
warmup_s = 300
power = 0.75                  # NEW (20 Oct evening, the owner's): (short / long) ^ 0.75, the ratio of the volatilities
                              # ^ 1.5: a 1.5x volatility gives x1.84 (was x1.5), 2x gives x2.83 (was x2); quieter: x0.8 sooner

[lag]                         # market data read late = quoting blind: as BTC
max_ms = 200
pause_ms = 500
max_pause_ms = 30000          # 20 Oct, the owner's: a stream that stays late keeps the bot out. A pause that starts under
calm_ms = 60000               # calm_ms (60 s) after the last one ended runs twice as long as that one (0.5, 1, 2, 4 .. 30 s);
                              # 60 s of on-time data brings it back to 500 ms. Binance futures read 200-250 ms late in bursts
                              # (BTC 14:27-14:29 p99 233 ms) that a flat 500 ms pause traded between.

[imbalance]                   # OFF until measured on this market
levels = 5
ratio = 0
factor = 5
hold_ms = 300
sides = "open"
