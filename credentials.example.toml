# Credentials template. The real file lives OUTSIDE the repository:
#
#   mkdir -p -m 700 ~/.config/naive_mm
#   install -m 600 credentials.example.toml ~/.config/naive_mm/credentials.toml
#   $EDITOR ~/.config/naive_mm/credentials.toml
#
# The agent will take the path from --credentials, else $NAIVE_MM_CREDENTIALS,
# else ~/.config/naive_mm/credentials.toml, and refuse a file that group or
# others can read. Mainnet and testnet keys are registered separately, so keep
# a second file for testnet (e.g. ~/.config/naive_mm/testnet.toml) and pass it
# explicitly.

[arcus]
# Wallet the API key is registered to. Not secret, but every signed order carries it.
address = "<0x-prefixed wallet address, 40 hex chars>"

# Subaccount to trade, 0-9. The key must be authorized for it (or for all
# subaccounts). A dedicated subaccount for the bot limits what a leaked key can touch.
account_index = 0

# "API Key" in the Arcus web app: the Ed25519 public key, 64 hex chars, no 0x.
api_key = "<64 hex chars>"

# "API Signing Key": the Ed25519 private key, 64 hex chars, shown once when the
# key is created. SECRET. The agent checks that it matches api_key.
# From an openssl key instead:
#   openssl pkey -in private.pem -outform DER | tail -c 32 | xxd -p -c 32
signing_key = "<64 hex chars>"

# Never put the wallet's private key or seed phrase here. The signing key can
# place and cancel orders but cannot withdraw: withdrawals and API key
# management need the wallet's own EIP-712 signature.

# Not needed for the public JSON market data streams in use now. Only for
# Binance SBE streams (stream-sbe.binance.com), which take an Ed25519 API key
# with no permissions enabled.
# [binance]
# api_key = "<Binance API key>"
